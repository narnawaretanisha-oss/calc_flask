{% extends "base.html" %}

{% block title %}Calculator | CalcSpace{% endblock %}

{% block content %}

<style>

/* =========================
   MAIN PAGE
========================= */

.calculator-page {
    min-height: calc(100vh - 84px);
    padding: 35px 20px;
    transition: 0.3s;
}


/* =========================
   HEADER
========================= */

.calculator-header {
    max-width: 900px;
    margin: 0 auto 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.calculator-header h1 {
    color: #754b63;
    margin-top: 5px;
}


/* =========================
   THEME SELECTOR
========================= */

.theme-box select {
    padding: 11px 16px;

    border-radius: 12px;
    border: 1px solid #dfc5d2;

    background: white;
    color: #65485a;

    font-size: 14px;
    font-weight: 600;

    outline: none;
    cursor: pointer;
}


/* =========================
   CALCULATOR
========================= */

.calculator {
    width: 430px;
    max-width: 100%;

    margin: auto;

    padding: 28px;

    background: #fff9fc;

    border: 1px solid #ead1dd;

    border-radius: 28px;

    box-shadow:
        0 20px 50px rgba(115, 70, 95, 0.18);

    transition: 0.3s;
}


.calculator-title {
    text-align: center;

    font-size: 26px;
    font-weight: 700;

    color: #754b63;

    margin-bottom: 20px;
}


/* =========================
   DISPLAY
========================= */

.display {
    width: 100%;

    height: 78px;

    padding: 15px;

    margin-bottom: 16px;

    border: 1px solid #e5cad7;

    border-radius: 15px;

    outline: none;

    background: #f8e9f0;

    color: #613f54;

    text-align: right;

    font-size: 29px;

    font-weight: 600;

    box-sizing: border-box;
}


/* =========================
   SCIENTIFIC BUTTONS
========================= */

.scientific-buttons {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;

    margin-bottom: 12px;
}


.scientific-buttons button {

    height: 42px;

    border: none;

    border-radius: 11px;

    background: #e5def1;

    color: #66547f;

    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;
}


.scientific-buttons button:hover {

    background: #d8cee9;

    transform: translateY(-2px);
}


/* =========================
   MAIN BUTTONS
========================= */

.buttons {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}


.buttons button {

    height: 58px;

    border: none;

    border-radius: 15px;

    font-size: 19px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;
}


/* NUMBER */

.number {

    background: #f1dce7;

    color: #714c62;
}


.number:hover {

    background: #e8c9da;

    transform: translateY(-2px);
}


/* OPERATOR */

.operator {

    background: #c9c0e5;

    color: #594b79;
}


.operator:hover {

    background: #bcb0db;

    transform: translateY(-2px);
}


/* CLEAR */

.clear {

    background: #d994a9;

    color: white;
}


.clear:hover {

    background: #c98098;

    transform: translateY(-2px);
}


/* EQUAL */

.equal {

    grid-column: span 4;

    background: #b8799a;

    color: white;
}


.equal:hover {

    background: #a66888;

    transform: translateY(-2px);
}


/* BUTTON PRESS */

.buttons button:active,
.scientific-buttons button:active {

    transform: scale(0.94);
}


/* =========================
   DECORATION
========================= */

.calculator-decoration {

    text-align: center;

    margin-top: 18px;

    color: #b8799a;

    font-size: 18px;
}


/* =====================================================
   GIRLIE THEME
===================================================== */

body.theme-girlie {

    background: #fdf4f8;
}

body.theme-girlie .calculator {

    background: #fff9fc;

    border-color: #ead1dd;
}

body.theme-girlie .display {

    background: #f8e9f0;

    color: #613f54;
}

body.theme-girlie .number {

    background: #f1dce7;

    color: #714c62;
}

body.theme-girlie .operator {

    background: #c9c0e5;

    color: #594b79;
}

body.theme-girlie .equal {

    background: #b8799a;
}


/* =====================================================
   LAVENDER THEME
===================================================== */

body.theme-lavender {

    background: #f5f1fb;
}

body.theme-lavender .calculator {

    background: #fbf9ff;

    border-color: #ddd2ee;
}

body.theme-lavender .calculator-title,
body.theme-lavender .calculator-header h1 {

    color: #68547f;
}

body.theme-lavender .display {

    background: #eee8f8;

    color: #594b70;

    border-color: #d8ccea;
}

body.theme-lavender .number {

    background: #e5dcf1;

    color: #5d4c72;
}

body.theme-lavender .operator {

    background: #cfc3e5;

    color: #51416b;
}

body.theme-lavender .scientific-buttons button {

    background: #e1d8ef;

    color: #63527c;
}

body.theme-lavender .equal {

    background: #9175ae;
}


/* =====================================================
   BLUE THEME
===================================================== */

body.theme-blue {

    background: #f0f7fb;
}

body.theme-blue .calculator {

    background: #fbfeff;

    border-color: #cddfe9;
}

body.theme-blue .calculator-title,
body.theme-blue .calculator-header h1 {

    color: #426779;
}

body.theme-blue .display {

    background: #e8f3f8;

    color: #3e5f70;

    border-color: #cbdfe8;
}

body.theme-blue .number {

    background: #dcecf3;

    color: #3f6272;
}

body.theme-blue .operator {

    background: #c6dce7;

    color: #3f6070;
}

body.theme-blue .scientific-buttons button {

    background: #dcecf3;

    color: #456b7c;
}

body.theme-blue .equal {

    background: #7daabd;
}


/* =====================================================
   GREEN THEME
===================================================== */

body.theme-green {

    background: #f1f8f3;
}

body.theme-green .calculator {

    background: #fbfffc;

    border-color: #d0e2d5;
}

body.theme-green .calculator-title,
body.theme-green .calculator-header h1 {

    color: #4c6d56;
}

body.theme-green .display {

    background: #e8f3eb;

    color: #456552;

    border-color: #cee1d3;
}

body.theme-green .number {

    background: #dcecdf;

    color: #496453;
}

body.theme-green .operator {

    background: #c7ddcc;

    color: #46614d;
}

body.theme-green .scientific-buttons button {

    background: #dcecdf;

    color: #4b6953;
}

body.theme-green .equal {

    background: #78a886;
}


/* =====================================================
   DARK THEME
===================================================== */

body.theme-dark {

    background: #202027;

    color: #eeeeee;
}

body.theme-dark .calculator {

    background: #2b2b35;

    border-color: #444451;
}

body.theme-dark .calculator-title,
body.theme-dark .calculator-header h1 {

    color: #f1d9e5;
}

body.theme-dark .small-heading {

    color: #d8a9bd;
}

body.theme-dark .display {

    background: #1f1f27;

    border-color: #464653;

    color: #f5e9ee;
}

body.theme-dark .number {

    background: #41414c;

    color: #f1e6eb;
}

body.theme-dark .number:hover {

    background: #4d4d59;
}

body.theme-dark .operator {

    background: #57516d;

    color: #eee8fa;
}

body.theme-dark .operator:hover {

    background: #625b7b;
}

body.theme-dark .scientific-buttons button {

    background: #494355;

    color: #eee7f4;
}

body.theme-dark .scientific-buttons button:hover {

    background: #585169;
}

body.theme-dark .equal {

    background: #9b6380;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .calculator-header {

        flex-direction: column;

        align-items: flex-start;

        gap: 15px;
    }

    .calculator {

        padding: 20px;
    }

}

</style>


<div class="calculator-page">

    <!-- HEADER -->

    <div class="calculator-header">

        <div>

            <p class="small-heading">
                PERSONAL CALCULATOR
            </p>

            <h1>
                Hey {{ username }} ♡
            </h1>

        </div>


        <!-- THEME -->

        <div class="theme-box">

            <select id="themeSelector">

                <option value="girlie">
                    🌸 Girlie
                </option>

                <option value="lavender">
                    💜 Lavender
                </option>

                <option value="blue">
                    🩵 Blue
                </option>

                <option value="green">
                    🌿 Green
                </option>

                <option value="dark">
                    🌙 Dark
                </option>

            </select>

        </div>

    </div>


    <!-- CALCULATOR -->

    <div class="calculator">

        <div class="calculator-title">
            ♡ Calculator ♡
        </div>


        <!-- DISPLAY -->

        <input
            type="text"
            id="display"
            class="display"
            value="0"
            readonly
        >


        <!-- SCIENTIFIC -->

        <div class="scientific-buttons">

            <button onclick="scientific('sqrt')">
                √
            </button>

            <button onclick="scientific('square')">
                x²
            </button>

            <button onclick="scientific('cube')">
                x³
            </button>

            <button onclick="scientific('sin')">
                sin
            </button>

            <button onclick="scientific('cos')">
                cos
            </button>

            <button onclick="scientific('tan')">
                tan
            </button>

            <button onclick="scientific('log')">
                log
            </button>

            <button onclick="press('Math.PI')">
                π
            </button>

        </div>


        <!-- MAIN BUTTONS -->

        <div class="buttons">


            <!-- ROW 1 -->

            <button
                class="clear"
                onclick="clearDisplay()">
                AC
            </button>

            <button
                class="operator"
                onclick="backspace()">
                ⌫
            </button>

            <button
                class="operator"
                onclick="press('%')">
                %
            </button>

            <button
                class="operator"
                onclick="press('/')">
                ÷
            </button>


            <!-- ROW 2 -->

            <button
                class="number"
                onclick="press('7')">
                7
            </button>

            <button
                class="number"
                onclick="press('8')">
                8
            </button>

            <button
                class="number"
                onclick="press('9')">
                9
            </button>

            <button
                class="operator"
                onclick="press('*')">
                ×
            </button>


            <!-- ROW 3 -->

            <button
                class="number"
                onclick="press('4')">
                4
            </button>

            <button
                class="number"
                onclick="press('5')">
                5
            </button>

            <button
                class="number"
                onclick="press('6')">
                6
            </button>

            <button
                class="operator"
                onclick="press('-')">
                −
            </button>


            <!-- ROW 4 -->

            <button
                class="number"
                onclick="press('1')">
                1
            </button>

            <button
                class="number"
                onclick="press('2')">
                2
            </button>

            <button
                class="number"
                onclick="press('3')">
                3
            </button>

            <button
                class="operator"
                onclick="press('+')">
                +
            </button>


            <!-- ROW 5 -->

            <button
                class="number"
                onclick="press('0')">
                0
            </button>

            <button
                class="number"
                onclick="press('.')">
                .
            </button>

            <button
                class="number"
                onclick="press('(')">
                (
            </button>

            <button
                class="number"
                onclick="press(')')">
                )
            </button>


            <!-- EQUAL -->

            <button
                class="equal"
                onclick="calculate()">
                =
            </button>

        </div>


        <div class="calculator-decoration">
            ✿ &nbsp; ♡ &nbsp; ✿
        </div>

    </div>

</div>


<script>

/* =========================
   DISPLAY
========================= */

let display =
    document.getElementById("display");


/* =========================
   PRESS
========================= */

function press(value) {

    if (
        display.value === "0" ||
        display.value === "Error"
    ) {

        display.value = value;

    }

    else {

        display.value += value;

    }

}


/* =========================
   CLEAR
========================= */

function clearDisplay() {

    display.value = "0";

}


/* =========================
   BACKSPACE
========================= */

function backspace() {

    if (
        display.value !== "Error" &&
        display.value.length > 1
    ) {

        display.value =
            display.value.slice(0, -1);

    }

    else {

        display.value = "0";

    }

}


/* =========================
   CALCULATE
========================= */

function calculate() {

    try {

        let expression =
            display.value;


        let calculationExpression =
            expression
                .replace(/÷/g, "/")
                .replace(/×/g, "*")
                .replace(/%/g, "/100");


        let result =
            eval(calculationExpression);


        if (
            result === undefined ||
            !isFinite(result)
        ) {

            display.value = "Error";

            return;

        }


        result =
            Number.isInteger(result)
                ? result
                : Number(result.toFixed(10));


        display.value = result;


        saveCalculation(
            expression,
            result
        );

    }

    catch (error) {

        console.log(error);

        display.value = "Error";

    }

}


/* =========================
   SCIENTIFIC
========================= */

function scientific(type) {

    try {

        let value =
            parseFloat(display.value);


        if (isNaN(value)) {

            display.value = "Error";

            return;

        }


        let result;


        if (type === "sqrt") {

            result =
                Math.sqrt(value);

        }

        else if (type === "square") {

            result =
                Math.pow(value, 2);

        }

        else if (type === "cube") {

            result =
                Math.pow(value, 3);

        }

        else if (type === "sin") {

            result =
                Math.sin(
                    value * Math.PI / 180
                );

        }

        else if (type === "cos") {

            result =
                Math.cos(
                    value * Math.PI / 180
                );

        }

        else if (type === "tan") {

            result =
                Math.tan(
                    value * Math.PI / 180
                );

        }

        else if (type === "log") {

            result =
                Math.log10(value);

        }


        if (
            result === undefined ||
            !isFinite(result)
        ) {

            display.value = "Error";

            return;

        }


        result =
            Number(result.toFixed(10));


        display.value = result;


        saveCalculation(
            type + "(" + value + ")",
            result
        );

    }

    catch (error) {

        console.log(error);

        display.value = "Error";

    }

}


/* =========================
   SAVE HISTORY
========================= */

function saveCalculation(
    expression,
    result
) {

    fetch("/save-calculation", {

        method: "POST",

        headers: {

            "Content-Type":
                "application/json"

        },

        body: JSON.stringify({

            expression:
                expression,

            result:
                result

        })

    })

    .then(response =>
        response.json()
    )

    .then(data => {

        console.log(
            "Saved:",
            data
        );

    })

    .catch(error => {

        console.log(
            "Save error:",
            error
        );

    });

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        let key =
            event.key;


        if (
            (key >= "0" && key <= "9") ||
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/" ||
            key === "%" ||
            key === "." ||
            key === "(" ||
            key === ")"
        ) {

            press(key);

        }

        else if (key === "Enter") {

            event.preventDefault();

            calculate();

        }

        else if (key === "Backspace") {

            backspace();

        }

        else if (key === "Escape") {

            clearDisplay();

        }

    }
);


/* =========================
   THEME
========================= */

let themeSelector =
    document.getElementById(
        "themeSelector"
    );


function applyTheme(theme) {

    document.body.classList.remove(

        "theme-girlie",
        "theme-lavender",
        "theme-blue",
        "theme-green",
        "theme-dark"

    );


    document.body.classList.add(
        "theme-" + theme
    );

}


/* =========================
   LOAD SAVED THEME
========================= */

let savedTheme =
    localStorage.getItem(
        "calculatorTheme"
    );


if (!savedTheme) {

    savedTheme = "girlie";

}


themeSelector.value =
    savedTheme;


applyTheme(savedTheme);


/* =========================
   CHANGE THEME
========================= */

themeSelector.addEventListener(
    "change",
    function() {

        let selectedTheme =
            themeSelector.value;


        localStorage.setItem(
            "calculatorTheme",
            selectedTheme
        );


        applyTheme(selectedTheme);

    }
);

</script>

{% endblock %}
