<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Girlie Calculator</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f6dce8,
                    #e7def4,
                    #f8e9df
                );
        }


        /* MAIN CALCULATOR */

        .calculator {

            width: 370px;

            padding: 28px;

            background: #fff8fb;

            border: 1px solid #efd3df;

            border-radius: 28px;

            box-shadow:
                0 20px 45px rgba(156, 102, 130, 0.22);
        }


        /* TITLE */

        .title {

            text-align: center;

            color: #754b63;

            font-size: 27px;

            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 20px;
        }


        .title::before {

            content: "♡ ";

            color: #c4779b;
        }


        .title::after {

            content: " ♡";

            color: #c4779b;
        }


        /* DISPLAY */

        .display {

            width: 100%;

            height: 82px;

            padding: 15px 18px;

            margin-bottom: 21px;

            border: 1px solid #e7cbd8;

            border-radius: 17px;

            outline: none;

            background: #f8e9f0;

            color: #633f55;

            font-size: 32px;

            font-weight: 600;

            text-align: right;

            box-shadow:
                inset 0 3px 8px rgba(140, 82, 110, 0.08);
        }


        /* BUTTON GRID */

        .buttons {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 11px;
        }


        /* ALL BUTTONS */

        button {

            height: 62px;

            border: none;

            border-radius: 16px;

            font-size: 20px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.2s ease;
        }


        /* NUMBER BUTTONS */

        .number {

            background: #f1dce7;

            color: #714c62;

            box-shadow:
                0 3px 7px rgba(150, 91, 120, 0.08);
        }


        .number:hover {

            background: #e9cadb;

            transform: translateY(-3px);

            box-shadow:
                0 7px 14px rgba(150, 91, 120, 0.16);
        }


        /* OPERATOR BUTTONS */

        .operator {

            background: #c9c0e5;

            color: #594b79;

            box-shadow:
                0 3px 7px rgba(105, 90, 145, 0.10);
        }


        .operator:hover {

            background: #bdb1dc;

            transform: translateY(-3px);

            box-shadow:
                0 7px 14px rgba(105, 90, 145, 0.18);
        }


        /* CLEAR BUTTON */

        .clear {

            background: #d994a9;

            color: #ffffff;
        }


        .clear:hover {

            background: #cb8299;

            transform: translateY(-3px);

            box-shadow:
                0 7px 14px rgba(190, 105, 135, 0.22);
        }


        /* EQUAL BUTTON */

        .equal {

            background: #b8799a;

            color: #ffffff;
        }


        .equal:hover {

            background: #a96889;

            transform: translateY(-3px);

            box-shadow:
                0 7px 14px rgba(160, 90, 125, 0.25);
        }


        /* ZERO */

        .zero {

            grid-column: span 2;
        }


        /* CLICK EFFECT */

        button:active {

            transform: scale(0.94);
        }


        /* RESULT */

        .result {

            margin-top: 20px;

            padding: 15px;

            text-align: center;

            background: #f4e5ed;

            border: 1px solid #e5cad8;

            border-radius: 14px;

            color: #856277;

            font-size: 14px;
        }


        .result strong {

            display: block;

            margin-top: 5px;

            color: #70465f;

            font-size: 22px;
        }


        /* LITTLE DECORATION */

        .calculator::after {

            content: "✿  ♡  ✿";

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #c184a1;

            font-size: 14px;

            letter-spacing: 5px;
        }


        /* RESPONSIVE */

        @media (max-width: 420px) {

            .calculator {

                width: 94%;

                padding: 20px;
            }


            button {

                height: 57px;
            }


            .display {

                height: 70px;

                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <div class="calculator">


        <div class="title">

            Calculator

        </div>


        <!-- DISPLAY -->

        <input
            type="text"
            class="display"
            id="display"
            value="0"
            readonly
        >


        <!-- BUTTONS -->

        <div class="buttons">


            <!-- ROW 1 -->

            <button
                class="clear"
                onclick="clearDisplay()">

                AC

            </button>


            <button
                class="operator"
                onclick="backspace()">

                ⌫

            </button>


            <button
                class="operator"
                onclick="press('%')">

                %

            </button>


            <button
                class="operator"
                onclick="press('/')">

                ÷

            </button>


            <!-- ROW 2 -->

            <button
                class="number"
                onclick="press('7')">

                7

            </button>


            <button
                class="number"
                onclick="press('8')">

                8

            </button>


            <button
                class="number"
                onclick="press('9')">

                9

            </button>


            <button
                class="operator"
                onclick="press('*')">

                ×

            </button>


            <!-- ROW 3 -->

            <button
                class="number"
                onclick="press('4')">

                4

            </button>


            <button
                class="number"
                onclick="press('5')">

                5

            </button>


            <button
                class="number"
                onclick="press('6')">

                6

            </button>


            <button
                class="operator"
                onclick="press('-')">

                −

            </button>


            <!-- ROW 4 -->

            <button
                class="number"
                onclick="press('1')">

                1

            </button>


            <button
                class="number"
                onclick="press('2')">

                2

            </button>


            <button
                class="number"
                onclick="press('3')">

                3

            </button>


            <button
                class="operator"
                onclick="press('+')">

                +

            </button>


            <!-- ROW 5 -->

            <button
                class="number zero"
                onclick="press('0')">

                0

            </button>


            <button
                class="number"
                onclick="press('.')">

                .

            </button>


            <button
                class="equal"
                onclick="calculate()">

                =

            </button>


        </div>


        <!-- FLASK RESULT -->

        {% if answer is not none %}

        <div class="result">

            Result

            <strong>

                {{ answer }}

            </strong>

        </div>

        {% endif %}


    </div>


    <script>


        let display =
            document.getElementById("display");


        /* ADD VALUE */

        function press(value) {

            if (
                display.value === "0" ||
                display.value === "Error"
            ) {

                display.value = value;

            }

            else {

                display.value += value;

            }

        }


        /* CLEAR */

        function clearDisplay() {

            display.value = "0";

        }


        /* BACKSPACE */

        function backspace() {

            if (
                display.value.length > 1 &&
                display.value !== "Error"
            ) {

                display.value =
                    display.value.slice(0, -1);

            }

            else {

                display.value = "0";

            }

        }


        /* CALCULATE */

        function calculate() {

            try {

                let expression =
                    display.value;


                expression =
                    expression.replace(
                        /%/g,
                        "/100"
                    );


                let result =
                    eval(expression);


                if (!isFinite(result)) {

                    display.value = "Error";

                }

                else {

                    display.value = result;

                }

            }

            catch {

                display.value = "Error";

            }

        }


        /* KEYBOARD SUPPORT */

        document.addEventListener(
            "keydown",
            function(event) {

                let key = event.key;


                if (
                    (key >= "0" && key <= "9") ||
                    key === "+" ||
                    key === "-" ||
                    key === "*" ||
                    key === "/" ||
                    key === "%" ||
                    key === "."
                ) {

                    press(key);

                }


                else if (key === "Enter") {

                    calculate();

                }


                else if (key === "Escape") {

                    clearDisplay();

                }


                else if (key === "Backspace") {

                    backspace();

                }

            }
        );


    </script>


</body>

</html>
